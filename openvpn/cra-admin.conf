#-- Configuration Generated By Viscosity --#

#viscosity startonopen false
#viscosity usepeerdns true
#viscosity dns automatic
#viscosity protocol openvpn
#viscosity autoreconnect true
#viscosity dnssupport true
#viscosity name eid-admin
#viscosity dhcp true
remote 85.207.59.162 1195 udp
nobind 
dev tun5
persist-tun 
persist-key 
compress lzo
pull 
tls-client 
ca /etc/openvpn/certs/oper2.crt
cert /etc/openvpn/certs/mph.crt
key /etc/openvpn/certs/mph.key
tls-auth /etc/openvpn/eid/ta.key 1
resolv-retry infinite
reneg-sec 43200
cipher AES-128-CBC
comp-lzo adaptive
script-security 2
#up /etc/openvpn/up-masq.sh
#down /etc/openvpn/down-masq.sh

#-- Configuration Generated By Viscosity --#

#viscosity startonopen false
#viscosity usepeerdns true
#viscosity dns automatic
#viscosity protocol openvpn
#viscosity autoreconnect false
#viscosity dnssupport true
#viscosity name "e-bs office"
#viscosity dhcp true
remote 82.208.45.118 1194 udp
nobind 
dev tun1
persist-tun 
persist-key 
#compress lzo
pull 
tls-client 
ca /etc/openvpn/certs/oper2.crt
cert /etc/openvpn/certs/mph.crt
key /etc/openvpn/certs/mph.key
tls-auth /etc/openvpn/ebs/ta.key 1
resolv-retry infinite
verify-x509-name "DC=cz, DC=eidentity, DC=ca, OU=Hosts, CN=kenny.e-bs.cz"
cipher AES-128-CBC
comp-lzo adaptive
#status /var/log/openvpn-ebs-status.log 20
#log /var/log/openvpn-ebs.log
verb 1
script-security 2
#up /etc/openvpn/up-masq.sh
#down /etc/openvpn/down-masq.sh
